<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch-On — Store manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');
:root{ --ink:#141414; --pink:#e83e8c; --paper:#faf6ee; --line:rgba(20,20,20,0.14); --yellow:#ffc93c; }
*{box-sizing:border-box;}
body{ margin:0; background:var(--paper); font-family:'Inter',sans-serif; color:var(--ink); }
h1,h2{ font-family:'Archivo Black'; font-weight:400; margin:0; }
.wrap{ max-width:1000px; margin:0 auto; padding:32px 24px 80px; }
button{ font-family:inherit; cursor:pointer; }

/* login */
#loginScreen{ max-width:360px; margin:120px auto; text-align:center; }
#loginScreen input{ width:100%; padding:14px; border:2px solid var(--line); border-radius:10px; font-size:15px; margin:16px 0; }
#loginScreen button{ width:100%; padding:14px; background:var(--ink); color:var(--paper); border:none; border-radius:10px; font-weight:700; font-size:15px; }
#loginError{ color:var(--pink); font-size:13px; margin-top:8px; display:none; }

/* dashboard shell */
#dashboard{ display:none; }
.top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
.top-bar button{ background:none; border:2px solid var(--ink); border-radius:100px; padding:8px 16px; font-weight:700; }
.tabs{ display:flex; gap:8px; margin-bottom:26px; }
.tab-btn{ border:2px solid var(--ink); background:transparent; padding:9px 18px; border-radius:100px; font-weight:700; font-size:13.5px; }
.tab-btn.active{ background:var(--ink); color:var(--paper); }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* orders */
.stat-strip{ display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
.stat-card{ border:2px solid var(--ink); border-radius:14px; padding:14px 18px; min-width:120px; }
.stat-card .num{ font-family:'Archivo Black'; font-size:26px; }
.stat-card .label{ font-size:12px; color:#666; }
.order-card{ border:2px solid var(--ink); border-radius:16px; padding:18px 20px; margin-bottom:16px; background:white; }
.order-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; }
.order-head h3{ font-family:'Inter'; font-weight:700; font-size:16px; }
.order-head .ref{ color:var(--pink); font-weight:700; }
.status-pill{ display:inline-block; padding:4px 12px; border-radius:100px; font-size:11.5px; font-weight:700; text-transform:uppercase; }
.status-pending_payment{ background:#f0e0c0; color:#7a5b00; }
.status-paid{ background:#d6f0df; color:#1c6b3a; }
.status-in_production{ background:#dbe6fb; color:#1f4fa8; }
.status-shipped{ background:#e6dbfb; color:#5b2fa8; }
.status-completed{ background:#141414; color:white; }
.status-cancelled{ background:#f0c0c0; color:#8a1f1f; }
.order-meta{ font-size:13px; color:#555; margin-top:6px; }
.order-items{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; }
.oi-card{ border:1px solid var(--line); border-radius:10px; padding:8px; width:120px; }
.oi-card img{ width:100%; height:70px; object-fit:cover; border-radius:6px; background:#f2f2f2; }
.oi-card .oi-label{ font-size:11px; font-weight:700; margin-top:6px; }
.oi-card .oi-price{ font-size:11px; color:#777; }
.order-actions{ margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.order-actions select{ padding:8px 10px; border-radius:8px; border:2px solid var(--line); font-weight:700; font-size:13px; }
.empty{ text-align:center; color:#888; padding:60px 0; }

/* products */
.product-toolbar{ display:flex; justify-content:flex-end; margin-bottom:16px; }
.btn-primary{ background:var(--pink); color:white; border:none; border-radius:100px; padding:10px 20px; font-weight:700; font-size:13.5px; }
.product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.product-card{ border:2px solid var(--ink); border-radius:14px; overflow:hidden; background:white; }
.product-card.inactive{ opacity:0.45; }
.product-card img{ width:100%; height:140px; object-fit:cover; background:#f2f2f2; }
.pc-body{ padding:12px 14px; }
.pc-body h4{ font-size:13.5px; margin:0 0 4px; }
.pc-body .pc-meta{ font-size:11.5px; color:#777; }
.pc-body .pc-price{ font-family:'Archivo Black'; font-size:16px; color:var(--pink); margin:6px 0; }
.pc-actions{ display:flex; gap:8px; }
.pc-actions button{ flex:1; border:1.5px solid var(--ink); background:transparent; border-radius:8px; padding:7px; font-size:11.5px; font-weight:700; }

/* product form modal */
.modal-overlay{ position:fixed; inset:0; background:rgba(20,20,20,0.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal-overlay.open{ display:flex; }
.modal{ background:var(--paper); border-radius:18px; width:min(480px,100%); max-height:90vh; overflow-y:auto; padding:26px; }
.modal h3{ font-size:20px; margin-bottom:18px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:700; margin-bottom:6px; }
.field input, .field select{ width:100%; padding:11px 13px; border:2px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; }
.field input[type=file]{ border:none; padding:0; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.modal-actions{ display:flex; gap:10px; margin-top:18px; }
.modal-actions button{ flex:1; padding:12px; border-radius:10px; font-weight:700; font-size:14px; border:2px solid var(--ink); }
.modal-actions .save-btn{ background:var(--ink); color:var(--paper); }
.modal-actions .cancel-btn{ background:transparent; }
.upl-preview{ display:none; width:100%; height:110px; object-fit:contain; background:#f2f2f2; border-radius:8px; margin-top:8px; }
.form-error{ color:var(--pink); font-size:12.5px; margin-top:6px; display:none; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Switch-On</h1>
  <p style="color:#666; margin-top:8px;">Store manager — staff only</p>
  <input type="password" id="pwInput" placeholder="Admin password">
  <button id="loginBtn">Log in</button>
  <p id="loginError">Wrong password — try again.</p>
</div>

<div class="wrap" id="dashboard">
  <div class="top-bar">
    <h1>Switch-On</h1>
    <button id="logoutBtn">Log out</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="products">Products</button>
  </div>

  <div class="tab-panel active" id="ordersPanel">
    <div class="stat-strip" id="statStrip"></div>
    <div id="orderList"></div>
  </div>

  <div class="tab-panel" id="productsPanel">
    <div class="product-toolbar">
      <button class="btn-primary" id="addProductBtn">+ Add product</button>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="productModalOverlay">
  <div class="modal">
    <h3 id="productModalTitle">Add product</h3>
    <div class="field"><label>Name</label><input id="pfName" placeholder="e.g. Classic Tee — Navy"></div>
    <div class="two-col">
      <div class="field">
        <label>Product type</label>
        <select id="pfType"><option value="tee">T-shirt</option><option value="hoodie">Hoodie</option><option value="beanie">Beanie</option></select>
      </div>
      <div class="field"><label>Price (R)</label><input id="pfPrice" type="number" min="1" placeholder="280"></div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Front photo</label>
        <input id="pfPhoto" type="file" accept="image/png,image/jpeg">
        <img id="pfPhotoPreview" class="upl-preview" alt="">
      </div>
      <div class="field">
        <label>Back photo (optional)</label>
        <input id="pfPhotoBack" type="file" accept="image/png,image/jpeg">
        <img id="pfPhotoBackPreview" class="upl-preview" alt="">
      </div>
    </div>
    <p style="font-size:12px;color:#777;margin:-4px 0 0;">Upload both and the card flips for customers. Front only = a normal card.</p>
    <p class="form-error" id="pfError"></p>
    <div class="modal-actions">
      <button class="cancel-btn" id="pfCancelBtn">Cancel</button>
      <button class="save-btn" id="pfSaveBtn">Save product</button>
    </div>
  </div>
</div>

<script>
const STATUS_LABELS = {
  pending_payment: 'Pending payment', paid: 'Paid', in_production: 'In production',
  shipped: 'Shipped', completed: 'Completed', cancelled: 'Cancelled'
};

async function checkLogin(){
  const r = await fetch('/api/admin/check');
  const { loggedIn } = await r.json();
  if(loggedIn){ showDashboard(); } else { showLogin(); }
}
function showLogin(){
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}
function showDashboard(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadOrders();
  loadProducts();
}
document.getElementById('loginBtn').onclick = async () => {
  const password = document.getElementById('pwInput').value;
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password}) });
  const errEl = document.getElementById('loginError');
  if(r.ok){ showDashboard(); return; }
  const data = await r.json().catch(()=>({}));
  errEl.textContent = data.error || 'Wrong password — try again.';
  errEl.style.display = 'block';
};
document.getElementById('logoutBtn').onclick = async () => {
  await fetch('/api/admin/logout', { method:'POST' });
  showLogin();
};

/* ---------- tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById(b.dataset.tab+'Panel').classList.add('active');
});

/* ---------- orders ---------- */
async function loadOrders(){
  const r = await fetch('/api/orders');
  if(r.status === 401){ showLogin(); return; }
  const orders = await r.json();
  renderStats(orders);
  renderOrders(orders);
}
function renderStats(orders){
  const total = orders.length;
  const pending = orders.filter(o=>o.status==='pending_payment').length;
  const paid = orders.filter(o=>o.status==='paid').length;
  const revenue = orders.filter(o=>o.status!=='pending_payment' && o.status!=='cancelled').reduce((s,o)=>s+o.total,0);
  document.getElementById('statStrip').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total orders</div></div>
    <div class="stat-card"><div class="num">${pending}</div><div class="label">Awaiting payment</div></div>
    <div class="stat-card"><div class="num">${paid}</div><div class="label">Paid, not started</div></div>
    <div class="stat-card"><div class="num">R${revenue}</div><div class="label">Confirmed revenue</div></div>
  `;
}
function renderOrders(orders){
  const el = document.getElementById('orderList');
  if(orders.length===0){ el.innerHTML = `<div class="empty">No orders yet.</div>`; return; }
  el.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-head">
        <div>
          <h3><span class="ref">${o.order_ref}</span> — ${o.customer_name}</h3>
          <div class="order-meta">${o.customer_phone} · ${o.fulfilment}${o.address ? ' · '+o.address : ''}</div>
          ${o.notes ? `<div class="order-meta">Notes: ${o.notes}</div>` : ''}
        </div>
        <span class="status-pill status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
      </div>
      <div class="order-items">
        ${o.items.map(it => `
          <div class="oi-card">
            <img src="${it.front_image_path || '/uploads/seed/logo.png'}" alt="">
            <div class="oi-label">${it.label}</div>
            <div class="oi-price">R${it.price}${it.personalisation_text ? ' · "'+it.personalisation_text+'"' : ''}</div>
          </div>
        `).join('')}
      </div>
      <div class="order-actions">
        <strong>R${o.total}</strong>
        <select data-order="${o.id}">
          ${Object.entries(STATUS_LABELS).map(([k,label]) => `<option value="${k}" ${o.status===k?'selected':''}>${label}</option>`).join('')}
        </select>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('select[data-order]').forEach(sel => {
    sel.onchange = async () => {
      await fetch(`/api/orders/${sel.dataset.order}/status`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status: sel.value })
      });
      loadOrders();
    };
  });
}

/* ---------- products ---------- */
let editingProductId = null;

async function loadProducts(){
  const r = await fetch('/api/products/all');
  if(r.status === 401){ showLogin(); return; }
  const products = await r.json();
  renderProducts(products);
}
function renderProducts(products){
  const el = document.getElementById('productGrid');
  if(products.length===0){ el.innerHTML = `<div class="empty">No products yet.</div>`; return; }
  el.innerHTML = products.map(p => `
    <div class="product-card ${p.active ? '' : 'inactive'}">
      <img src="${p.photo_url || '/uploads/seed/logo.png'}" alt="">
      <div class="pc-body">
        <h4>${p.name}</h4>
        <div class="pc-meta">${p.product_type}${p.photo_back_url ? ' · front + back (flips)' : ' · front only'}</div>
        <div class="pc-price">R${p.price}</div>
        <div class="pc-actions">
          <button data-edit="${p.id}">Edit</button>
          <button data-toggle="${p.id}">${p.active ? 'Deactivate' : 'Activate'}</button>
        </div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openProductModal(products.find(p=>p.id==b.dataset.edit)));
  el.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    await fetch(`/api/products/${b.dataset.toggle}/toggle`, { method:'POST' });
    loadProducts();
  });
}

document.getElementById('addProductBtn').onclick = () => openProductModal(null);
document.getElementById('pfCancelBtn').onclick = () => closeProductModal();
document.getElementById('productModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='productModalOverlay') closeProductModal(); });
function wirePreview(inputId, imgId){
  document.getElementById(inputId).addEventListener('change', e => {
    const img = document.getElementById(imgId), f = e.target.files[0];
    if(f){ img.src = URL.createObjectURL(f); img.style.display = 'block'; } else { img.style.display = 'none'; }
  });
}
wirePreview('pfPhoto','pfPhotoPreview');
wirePreview('pfPhotoBack','pfPhotoBackPreview');

function openProductModal(product){
  editingProductId = product ? product.id : null;
  document.getElementById('productModalTitle').textContent = product ? 'Edit product' : 'Add product';
  document.getElementById('pfName').value = product ? product.name : '';
  document.getElementById('pfType').value = product ? product.product_type : 'tee';
  document.getElementById('pfPrice').value = product ? product.price : '';
  document.getElementById('pfPhoto').value = '';
  document.getElementById('pfPhotoBack').value = '';
  const fp = document.getElementById('pfPhotoPreview'), bp = document.getElementById('pfPhotoBackPreview');
  fp.src = product && product.photo_url ? product.photo_url : ''; fp.style.display = fp.src ? 'block' : 'none';
  bp.src = product && product.photo_back_url ? product.photo_back_url : ''; bp.style.display = bp.src ? 'block' : 'none';
  document.getElementById('pfError').style.display = 'none';
  document.getElementById('productModalOverlay').classList.add('open');
}
function closeProductModal(){ document.getElementById('productModalOverlay').classList.remove('open'); }

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('pfSaveBtn').onclick = async () => {
  const errorEl = document.getElementById('pfError');
  errorEl.style.display = 'none';

  const payload = {
    name: document.getElementById('pfName').value.trim(),
    product_type: document.getElementById('pfType').value,
    price: Number(document.getElementById('pfPrice').value)
  };
  const frontFile = document.getElementById('pfPhoto').files[0];
  const backFile = document.getElementById('pfPhotoBack').files[0];
  if(!editingProductId && !frontFile){
    errorEl.textContent = 'Please choose the front photo.'; errorEl.style.display = 'block'; return;
  }
  if(frontFile) payload.photo = await readFileAsDataUrl(frontFile);
  if(backFile) payload.photo_back = await readFileAsDataUrl(backFile);

  const url = editingProductId ? `/api/products/${editingProductId}` : '/api/products';
  const method = editingProductId ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });

  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    errorEl.textContent = err.error || 'Could not save this product.';
    errorEl.style.display = 'block';
    return;
  }
  closeProductModal();
  loadProducts();
};

checkLogin();
</script>
</body>
</html>
